<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta content="width=device-width, initial-scale=1">
  <title>Green Dash</title>

  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
        integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N"
        crossorigin="anonymous">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="main">
    <div class="dashboard-header">
      <h1>Green Dash</h1>
      <small class="text-muted">by Raphael Gamboa of N24 Group 5</small>
    </div>

    <div class="row">
      <div class="col-lg-4">
        <div class="chart-card">
          <h5>Most Ordered Items</h5>
          <p class="text-muted">Top Items in one store</p>
          <canvas id="itemsChart" width="200" height="200"></canvas>
        </div>
      </div>

      <div class="col-lg-4">
        <div class="chart-card">
          <h5>Payment Methods</h5>
          <p class="text-muted">Share of orders at one store</p>
          <canvas id="paymentChart" width="200" height="200"></canvas>
        </div>
      </div>

      <div class="col-lg-4">
        <div class="chart-card">
          <h5>Weekly Order Cancellations</h5>
          <p class="text-muted">Cancelled orders per week, by store</p>
          <canvas id="cancelChart" width="200" height="200"></canvas>
        </div>
      </div>
    </div>
  </div>

  <script 
  src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"
  integrity="sha384-Fy6S3B9q64WdZWQUiU+q4/2Lc9npb8tCaSX9FK7E8HnRr0Jz8D6OP9dO5Vg3Q9ct"
  crossorigin="anonymous">
  </script>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="charts.js"></script>
</body>
</html>
